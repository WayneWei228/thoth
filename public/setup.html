<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Set up Thoth</title>
<script>
  // ?theme=dark|light forces a theme (screenshots, users who want it); default follows the system
  (function () { const t = new URLSearchParams(location.search).get('theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; })();
</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
  /* The setup page uses the panel's own tokens and components (style.css): --bg, --panel, --side, --line,
     --text, --muted, --accent, --red, --amber, --green, .btn, .pill, .spin, input. Nothing here defines a colour.
     The two blocks below only serve ?theme=light|dark. They must hold the same values as style.css
     (a test compares them).*/
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f6f6f4; --panel: #ffffff; --side: #efeeea; --line: #e2e0da; --text: #1f1e1c; --muted: #77746d;
    --red-bg: #fdecec; --amber-bg: #fdf4e1; --term: #1b1b1a; --shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1c1c1b; --panel: #252524; --side: #20201f; --line: #353533; --text: #ecebe8; --muted: #9b9890;
    --red-bg: #3a2222; --amber-bg: #3a3020; --term: #161615; --shadow: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  }
  :root { --mono: "SF Mono", Menlo, ui-monospace, Consolas, monospace; --green-bg: rgba(47,158,91,.14);
    --red-line: rgba(217,63,63,.35); --amber-line: rgba(201,138,18,.4); --green-line: rgba(47,158,91,.35); }

  html { -webkit-text-size-adjust: 100%; }
  body { height: auto; min-height: 100%; }
  a, .linkbtn { color: var(--accent); }
  :focus-visible:not(input):not(textarea) { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* Layout: the panel's sidebar on the left (progress + this computer), one decision on the right. */
  .app { display: grid; grid-template-columns: 280px minmax(0, 1fr); min-height: 100vh; }
  .rail { background: var(--side); border-right: 1px solid var(--line); padding: 14px 8px; display: flex; flex-direction: column; gap: 14px; }
  .stage { padding: 28px 32px 48px; min-width: 0; }
  .view { max-width: 640px; }

  h1.brand { margin: 0; padding: 0 6px; line-height: 1.45; }
  .brand-sub { margin: 0; padding: 0 6px; font-size: 12px; color: var(--muted); }

  /* Steps: rows like the session rows of the sidebar; the current one is the active row */
  .steps { list-style: none; margin: 0; padding: 0; }
  .steps li { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; margin: 2px 0; border: 1px solid transparent; border-radius: 10px; }
  .steps li.now { background: var(--panel); border-color: var(--line); box-shadow: var(--shadow); }
  .steps .n { width: 18px; height: 18px; margin-top: 1px; border-radius: 50%; display: grid; place-items: center; flex: none;
    font-size: 11px; font-weight: 600; border: 1px solid var(--gray); color: var(--muted); }
  .steps li.done .n { border-color: transparent; color: var(--green); }
  .steps li.now .n { background: var(--accent); border-color: var(--accent); color: #fff; }
  .steps .t { color: var(--muted); text-align: left; min-width: 0; }
  .steps li.now .t { color: var(--text); font-weight: 600; }
  .steps li.done .t { color: var(--text); }
  .steps .s { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }
  .steps button.t { all: unset; cursor: pointer; color: var(--text); }
  .steps button.t:hover { text-decoration: underline; text-underline-offset: 3px; }
  .steps button.t:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  .machine { border-top: 1px solid var(--line); padding: 12px 10px 0; }
  .machine h2 { font-size: 12px; margin: 0 0 6px; color: var(--muted); font-weight: 600; }
  .machine summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 8px; }
  .machine summary::-webkit-details-marker { display: none; }
  .machine summary .chev { margin-left: auto; color: var(--muted); transition: transform .15s; }
  .machine details[open] summary .chev { transform: rotate(90deg); }
  .chk { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 8px; padding: 6px 0; font-size: 13px; }
  .chk + .chk { border-top: 1px solid var(--line); }
  .chk .cause { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .chk > div { overflow-wrap: anywhere; }
  .linkbtn { all: unset; cursor: pointer; color: var(--accent); font-size: 13px; text-decoration: underline; text-underline-offset: 2px; }
  .linkbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .machine .foot { margin-top: 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .machine .foot .linkbtn { font-size: 12px; }

  .mprog { display: none; }

  /* Type: the sizes of the panel (22 title, 14 text, 13 and 12 small, 11 pills) */
  .kicker { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 2px; }
  .view h2 { font-size: 22px; line-height: 1.25; margin: 0 0 4px; }
  .lead { color: var(--muted); margin: 0 0 18px; max-width: 64ch; }
  .lead b { color: var(--text); font-weight: 600; }
  .view h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 22px 0 8px; }
  .small { font-size: 12px; }
  p { margin: 0 0 8px; }

  /* Controls: .btn, .btn.primary, .btn.ghost, .btn.small and input come from style.css */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
  .btn[aria-disabled="true"] { opacity: .45; }
  input[type=text] { width: 100%; min-width: 0; }
  input[type=text]::placeholder { color: var(--muted); opacity: .75; }
  .nav { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .nav .right { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }

  /* Surfaces: one kind of box (as .req in the panel): panel colour, one thin line, radius 10 */
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stack > * + * { margin-top: 8px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .dname { font-weight: 600; }
  .dmeta { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
  .ico { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--bg); color: var(--muted); flex: none; }
  .ico.on { color: var(--text); }

  .pill { display: inline-flex; align-items: center; gap: 5px; }
  .pill.ok { background: var(--green-bg); color: var(--green); }
  .pill.wait { background: var(--amber-bg); color: var(--amber); }
  .pill.bad { background: var(--red-bg); color: var(--red); }
  .pill .d { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .pill.wait .d { animation: pulse 1.2s ease-in-out infinite; }

  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg label { cursor: pointer; flex: 1; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: block; padding: 6px 10px; font-size: 13px; color: var(--muted); background: var(--panel); text-align: center; }
  .seg label + label span { border-left: 1px solid var(--line); }
  .seg input:checked + span { background: var(--bg); color: var(--text); font-weight: 600; }
  .seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -2px; }

  .devrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
  .dact { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .add { all: unset; box-sizing: border-box; display: block; width: 100%; text-align: center; cursor: pointer; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); padding: 9px 12px; }
  .add:hover { color: var(--text); border-color: var(--muted); }

  /* Join instructions */
  .how { margin: 10px 0 0; padding-top: 10px; border-top: 1px solid var(--line); }
  .how ol { margin: 0; padding-left: 20px; }
  .how li { margin: 4px 0; }
  .how li::marker { color: var(--muted); font-weight: 600; }
  .cmd { position: relative; margin: 6px 0 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 70px 8px 10px;
    font: 12px/1.5 var(--mono); overflow-wrap: anywhere; color: var(--text); }
  .box .cmd, .list .cmd, dialog .cmd { background: var(--bg); }
  .cmd .btn { position: absolute; top: 5px; right: 5px; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif; }

  /* Choices (brain): a box with a radio; the chosen one has the accent line */
  .opt { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; position: relative; }
  .opt:hover { border-color: var(--muted); }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt .radio { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--gray); flex: none; display: grid; place-items: center; }
  .opt:has(input:checked) { border-color: var(--accent); }
  .opt:has(input:checked) .radio { border-color: var(--accent); }
  .opt:has(input:checked) .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .opt:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
  .opt.off { cursor: default; opacity: .55; }
  .opt.off:hover { border-color: var(--line); }

  /* Notices: the colours of the panel's own states (red = needs you, amber = wait, green = good) */
  .note { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 8px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
  .note > svg { color: var(--muted); }
  .note p { margin: 0; } .note p + p, .note p + .cmd, .note .cmd + p { margin-top: 4px; }
  .note.warn { background: var(--amber-bg); border-color: var(--amber-line); }
  .note.warn > svg { color: var(--amber); }
  .note.ok > svg { color: var(--green); }
  .note.bad { background: var(--red-bg); border-color: var(--red-line); }
  .note.bad > svg { color: var(--red); }
  .note .t { font-weight: 600; }
  .note .acts { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; align-items: center; }
  .note .cmd { background: var(--panel); }
  .fixp { margin: 4px 0 0; font-size: 12px; }
  .rail .cmd { padding: 8px 10px 36px; }
  .rail .cmd .btn { top: auto; bottom: 5px; }
  .probs { margin-bottom: 18px; }
  .note .fixp { font-size: 13px; }
  .err:empty { display: none; }
  .err { margin-top: 12px; }

  .ack { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; margin-top: 12px; }
  .ack input { width: 16px; height: 16px; padding: 0; accent-color: var(--accent); margin: 2px 0 0; flex: none; }
  .ack:has(input:checked) { border-color: var(--accent); }

  /* Device map: the one drawing on the page. Thin lines; green = connected (as the panel's status dot) */
  .map { display: block; width: 100%; max-width: 440px; height: auto; margin: 0 0 16px; }
  .map .edge { stroke: var(--gray); stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
  .map .edge.on { stroke: var(--green); stroke-dasharray: none; }
  .map .node { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
  .map .node.on { stroke: var(--green); }
  .map .hub { fill: var(--accent); }
  .map .hubring { display: none; }
  .map .glyph { color: var(--muted); } .map .glyph.on { color: var(--text); } .map .glyph.hub { color: #fff; }
  .map text { font-size: 12px; font-weight: 600; fill: var(--text); text-anchor: middle; }
  .map text.msub { font-size: 11px; font-weight: 400; fill: var(--muted); }

  /* Welcome */
  .welcome ol.plan { list-style: none; padding: 0; margin: 0 0 20px; counter-reset: p; }
  .welcome ol.plan li { counter-increment: p; display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .welcome ol.plan li:last-child { border-bottom: 1px solid var(--line); }
  .welcome ol.plan li::before { content: counter(p); font-weight: 600; color: var(--muted); }
  .welcome ol.plan b { font-weight: 600; }

  /* Step 5 lists */
  .list { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); overflow: hidden; }
  .list .item { padding: 10px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .list .item + .item { border-top: 1px solid var(--line); }
  .count { font-size: 17px; font-weight: 650; line-height: 1.1; color: var(--text); min-width: 3ch; text-align: right; }
  .count small { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
  .skel { height: 12px; border-radius: 6px; background: var(--line); width: 60%; }
  .item .msg { flex-basis: 100%; font-size: 12px; }
  .item .msg.bad { color: var(--red); } .item .msg.ok { color: var(--green); }
  .none { padding: 16px 14px; text-align: center; color: var(--muted); font-size: 13px; }
  .none b { display: block; color: var(--text); font-weight: 600; font-size: 14px; margin-bottom: 2px; }

  /* Pop-ups: the panel's modal card */
  dialog { border: 0; border-radius: 14px; background: var(--panel); color: var(--text); padding: 18px 20px; width: min(640px, calc(100vw - 32px)); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  dialog h3 { margin: 0 0 6px; font-size: 16px; }
  .fixacts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .fixacts .note2 { width: 100%; font-size: 12px; color: var(--muted); }
  .chk .fixacts .btn { white-space: normal; text-align: left; }
  #fixbox ol { margin: 10px 0; padding-left: 20px; } #fixbox li { margin: 4px 0; }
  #fixbox details { margin-top: 12px; } #fixbox summary { cursor: pointer; }
  #fixbox .fixstatus { margin: 10px 0 0; min-height: 1.4em; font-weight: 600; } #fixbox .fixstatus:empty { display: none; } #fixbox .fixstatus.ok { color: var(--green); } #fixbox .fixstatus.bad { color: var(--red); }
  .dialog-foot { display: flex; justify-content: flex-end; margin-top: 10px; }
  dialog textarea { width: 100%; height: 300px; font: 12px var(--mono); background: var(--bg); }

  /* Cloud brain: link box, device decisions */
  .linkbox { padding: 10px 12px; border-radius: 10px; background: var(--side); }
  .linkbox label { display: block; font-weight: 600; margin-bottom: 6px; }
  .linkbox .row { flex-wrap: nowrap; }
  .linkbox input[type=text] { font-family: var(--mono); font-size: 13px; }
  .asking { border-color: var(--amber); }
  .asking .dname b { font-weight: 600; color: var(--amber); }
  .decide { display: flex; gap: 6px; flex-wrap: wrap; }
  details.fold { margin-top: 12px; } details.fold > summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  details.fold[open] > summary { margin-bottom: 8px; }
  .oslabel { font-size: 12px; color: var(--muted); margin: 8px 0 0; }

  /* Narrow windows and phones: the sidebar becomes a header; the steps become a bar */
  @media (max-width: 720px) {
    .app { grid-template-columns: minmax(0, 1fr); align-content: start; min-height: 0; }
    /* order: title, the step, then the checks of this computer (a problem also shows at the top of the step) */
    .rail { display: contents; }
    .brandbox { order: 0; padding: 10px 10px; background: var(--side); border-bottom: 1px solid var(--line); }
    .steps { display: none; }
    .stage { order: 1; padding: 18px 16px 32px; }
    .machine { order: 2; padding: 12px 16px 28px; background: var(--side); }
    .mprog { display: block; margin-bottom: 16px; }
    .mprog .bar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 6px; }
    .mprog .bar i { height: 3px; border-radius: 2px; background: var(--line); }
    .mprog .bar i.done { background: var(--accent); } .mprog .bar i.now { background: var(--accent); opacity: .5; }
    .mprog .lbl { font-size: 12px; font-weight: 600; color: var(--muted); }
    .kicker.stepk { display: none; }
    .dact { flex-basis: 100%; justify-content: space-between; }
    .devrow { grid-template-columns: minmax(0, 1fr) auto; }
    .devrow .seg { grid-column: 1 / -1; order: 3; display: flex; }
    .linkbox .row { flex-wrap: wrap; } .linkbox .row .btn { width: 100%; }
    .decide { flex-basis: 100%; } .decide .btn { flex: 1; }
  }
  /* Touch screens: larger targets, same look */
  @media (max-width: 720px) and (pointer: coarse) {
    .btn { padding: 9px 14px; } .btn.small { padding: 7px 12px; font-size: 13px; }
    input[type=text] { font-size: 16px; padding: 9px 10px; }
    .nav { flex-direction: column-reverse; align-items: stretch; }
    .nav .right { margin-left: 0; flex-direction: column; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brandbox">
      <h1 class="brand"><img class="logo" src="/logo.svg" alt=""> Set up Thoth</h1>
      <p class="brand-sub">One panel for all your computers</p>
    </div>
    <ol class="steps" id="steps" aria-label="Setup steps"></ol>
    <section class="machine" aria-label="This computer">
      <h2>This computer</h2>
      <div id="checks"><p class="small muted">Checking this computer…</p></div>
    </section>
  </aside>
  <main class="stage">
    <div class="mprog" id="mprog"></div>
    <div class="view" id="view" aria-live="polite"><p class="muted">Loading…</p></div>
  </main>
</div>
<dialog id="fixbox" aria-labelledby="fixtitle">
  <h3 id="fixtitle"></h3><p id="fixcause"></p>
  <div class="fixacts" id="fixbtns"></div>
  <details id="fixmanual"><summary class="small muted" id="fixsum">I'd rather do it myself in System Settings</summary><ol id="fixsteps"></ol><div class="fixacts" id="fixbtns2"></div></details>
  <p class="fixstatus" id="fixstatus" role="status"></p>
  <div class="dialog-foot"><button class="btn" id="fixclose">Later</button></div>
</dialog>
<dialog id="copybox">
  <h3>Copy this text</h3>
  <p class="small muted" style="margin:0 0 10px">Your browser did not allow copying. Select all the text below and copy it.</p>
  <textarea id="copytext" readonly></textarea>
  <div class="dialog-foot"><button class="btn" id="copyclose">Close</button></div>
</dialog>
<script>
'use strict';
const NAMES = ['Your devices', 'Connect them', 'Your brain', 'Keep it on', 'Move sessions in'];
const CLOUD = ':cloud';   // S.brain for a cloud brain (lib/setup.js)
const OS = { macos: 'macOS', linux: 'Linux', windows: 'Windows' };
const SLEEP_ADVICE = {
  macos: 'On the Mac: System Settings, Energy (or Battery, Options). Turn on "Prevent automatic sleeping when the display is off", and keep it plugged in.',
  linux: 'On the Linux computer: turn off automatic suspend in Settings, Power. Or run: sudo systemctl mask sleep.target suspend.target',
  windows: 'On the Windows PC: Settings, System, Power. Set "When plugged in, put my device to sleep after" to Never.',
};
let S = null;            // GET /api/setup
let O = null;            // GET /api/setupOutside (step 5)
let welcome = false;     // show the welcome screen before step 1
let ADDING = false, CHANGING = false;   // manage view (after setup): add form, brain chooser open
let PICK = null;         // step 3 / manage: the brain choice on screen ('cloud' or a device name)
let CODE = null, CODE_ERR = '';   // cloud: the last pre-approved code
const PAIRS = {}, PAIR_ERR = {}, MOVE = {};
const isCloud = () => S && S.brain === CLOUD;
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch { /* private mode */ } } };

/* ---------- icons ---------- */
const I = {
  check: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  warn: '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2.5l8 14H2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M10 8v4M10 14.3v.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  bad: '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 5.5v5.5M10 13.8v.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  ok: '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6.5 10.3l2.3 2.3 4.7-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  info: '<svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 9v5M10 6.2v.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
  chev: '<svg class="chev" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>',

/* ---------- helpers ---------- */
async function api(path, body) {
  let r;
  try { r = await fetch(path, body === undefined ? { cache: 'no-store' } : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }); }
  catch { throw new Error('The panel server on this computer did not answer. Check that it is still running (thoth web), then try again.'); }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || `The server refused the request (${r.status}).`); e.problem = j.problem; throw e; }
  return j;
}
async function copy(text, btn) {
  try {
    await navigator.clipboard.writeText(text);
    if (btn) { const old = btn.innerHTML; btn.textContent = 'Copied'; setTimeout(() => { btn.innerHTML = old; }, 1600); }
  } catch { $('copytext').value = text; $('copybox').showModal(); $('copytext').select(); }
}
async function copyDiagnostics(btn) {
  let t;
  try { const r = await fetch('/api/setupDiagnostics', { cache: 'no-store' }); t = await r.text(); }
  catch { t = 'The panel server did not answer, so no diagnostics could be collected.'; }
  copy(t, btn);
}
function ago(t) {
  const m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60); return h < 48 ? `${h} h ago` : `${Math.round(h / 24)} days ago`;
}
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const self = () => S.devices.find((d) => d.self);
const others = () => S.devices.filter((d) => !d.self);
function errBox(msg, title = 'That did not work') {
  return `<div class="note bad" role="alert">${I.bad}<div><p class="t">${esc(title)}</p><p>${esc(msg)}</p>
    <div class="acts"><button class="linkbtn" data-diag>Copy diagnostics</button><span class="small muted">Paste them when you ask for help.</span></div></div></div>`;
}
// a fix from lib/setup.js is prose, a command, or "prose: command   (note)"; show commands as copyable blocks
const CMD = /^(?:brew|sudo|curl|python3|thoth|npm|node|scripts\/|winget)\b/;
function fixBlock(fix) {
  let text = String(fix || '').trim(), note = '';
  const par = text.match(/^(.*?)\s+\(([^()]*)\)$/); if (par) { text = par[1]; note = par[2]; }
  let prose = '', cmd = '';
  if (CMD.test(text)) cmd = text;
  else { const m = text.match(/^(.*?:)\s+(\S.*)$/); if (m && CMD.test(m[2])) { prose = m[1]; cmd = m[2]; } else prose = text + (note ? ` (${note})` : ''); }
  if (!cmd) return `<p class="fixp">${esc(prose)}</p>`;
  return `${prose ? `<p class="fixp">${esc(prose)}</p>` : ''}${cmdBlock(cmd)}${note ? `<p class="fixp small muted">${esc(note[0].toUpperCase() + note.slice(1))}.</p>` : ''}`;
}
const cmdBlock = (cmd) => `<div class="cmd"><span>${esc(cmd)}</span><button class="btn small" data-copy="${esc(cmd)}">Copy</button></div>`;

/* ---------- device map: the hub (brain or this computer) and the others below it ---------- */
function deviceMap(hub, around) {
  const W = 440, cx = W / 2, cy = 38, n = around.length, H = n ? 186 : 80;
  const pts = around.map((d, i) => ({ d, x: n === 1 ? cx : 46 + i * ((W - 92) / (n - 1)), y: 128 }));
  const edges = pts.map((p) => `<path class="edge ${p.d.on ? 'on' : ''}" d="M${cx} ${cy + 26} C ${cx} ${cy + 62}, ${p.x} ${p.y - 52}, ${p.x} ${p.y - 19}"/>`).join('');
  const nodes = pts.map((p) => {
    const anchor = n > 1 && p.x < 70 ? 'start' : n > 1 && p.x > W - 70 ? 'end' : 'middle';
    const tx = anchor === 'start' ? p.x - 18 : anchor === 'end' ? p.x + 18 : p.x;
    return `<circle class="node ${p.d.on ? 'on' : ''}" cx="${p.x}" cy="${p.y}" r="18"/>
      <g class="glyph ${p.d.on ? 'on' : ''}" transform="translate(${p.x - 10} ${p.y - 10})">${svgGlyph(p.d.os, 20)}</g>
      <text x="${tx}" y="${p.y + 36}" style="text-anchor:${anchor}">${esc(p.d.name)}</text>`;
  }).join('');
  const label = `${hub.name} (${hub.sub})${n ? `: ${around.map((d) => `${d.name} ${d.on ? 'connected' : 'not connected'}`).join(', ')}` : ''}`;
  return `<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${edges}
    <circle class="hubring" cx="${cx}" cy="${cy}" r="30"/><circle class="hub" cx="${cx}" cy="${cy}" r="25"/>
    <g class="glyph hub" transform="translate(${cx - 12} ${cy - 12})">${svgGlyph(hub.os, 24)}</g>
    <text x="${cx + 42}" y="${cy - 2}" style="text-anchor:start">${esc(hub.name)}</text>
    <text class="msub" x="${cx + 42}" y="${cy + 14}" style="text-anchor:start">${esc(hub.sub)}</text>${nodes}</svg>`;
}

/* ---------- rail ---------- */
function stepSub(k) {
  if (k === 1) return plural(S.devices.length, 'computer');
  if (k === 2 && isCloud() && S.cloud) { const a = (S.cloud.approved || []).filter((d) => !d.self).length, w = (S.cloud.pending || []).length;
    return `${a} connected${w ? `, ${w} waiting` : ''}`; }
  if (k === 2) { const o = others(); return o.length ? `${o.filter((d) => d.connected).length} of ${o.length} connected` : 'Nothing to connect'; }
  if (k === 3) return isCloud() ? 'Cloud brain' : S.brain || '';
  if (k === 4) return isCloud() ? 'Not needed' : S.keepOn.ack ? 'Confirmed' : '';
  return '';
}
function renderRail() {
  const cur = S.done ? 6 : welcome ? 0 : S.step;
  $('steps').innerHTML = NAMES.map((n, i) => {
    const k = i + 1, cls = k < cur ? 'done' : k === cur ? 'now' : '';
    const sub = k < cur || (k === cur && k !== 5) ? stepSub(k) : '';
    const canGo = !S.done && !welcome && k < S.step && !(k === 4 && isCloud());
    const label = `${esc(n)}${sub ? `<span class="s">${esc(sub)}</span>` : ''}`;
    return `<li class="${cls}" ${k === cur ? 'aria-current="step"' : ''}><span class="n">${k < cur ? I.check : k}</span>
      ${canGo ? `<button class="t" data-goto="${k}" title="Go back to this step">${label}</button>` : `<span class="t">${label}</span>`}</li>`;
  }).join('');
  const prog = S.done || welcome ? '' : `<div class="lbl">Step ${S.step} of 5: ${esc(NAMES[S.step - 1])}</div>
    <div class="bar">${NAMES.map((_, i) => `<i class="${i + 1 < S.step ? 'done' : i + 1 === S.step ? 'now' : ''}"></i>`).join('')}</div>`;
  $('mprog').innerHTML = prog;
  $('mprog').hidden = !prog;
  renderChecks();
}
// ---- guided fixes: buttons that open System Settings / a password prompt / Terminal (lib/setup_fix.js)
function fixActions(c) {
  if (!c || c.ok || !c.actions || !c.actions.length) return '';
  return `<div class="fixacts"><button class="btn small primary" data-fixcheck="${esc(c.id || 'keepon')}">${esc(c.actions[0].label)}</button></div>`;
}
function allFixable() {
  const list = (S.checks || []).filter((c) => !c.ok && c.actions && c.actions.length);
  const k = S.keepOn && S.keepOn.check;
  if (S.brain && !isCloud() && k && !k.ok && k.actions && !S.done && S.step >= 4) list.push({ ...k, id: 'keepon', title: 'Keep the brain awake', cause: k.detail });
  return list;
}
const FIX = { open: null, dismissed: new Set(), timer: null };
function findCheck(id) { return allFixable().find((c) => c.id === id) || null; }
function openFix(id) {
  const c = findCheck(id); if (!c) return;
  FIX.open = id;
  $('fixtitle').textContent = c.title.replace(/^Other computers can reach this one$/, 'Let your other computers reach this one');
  $('fixcause').textContent = c.cause || c.detail || '';
  // one button does it; the manual way stays folded away (user: nobody can find one entry in a long list)
  const [main, ...rest] = c.actions;
  $('fixbtns').innerHTML = `<button class="btn primary" data-fix="${esc(main.id)}">${esc(main.label)}</button>` + (main.note ? `<span class="note2">${esc(main.note)}</span>` : '');
  $('fixsteps').innerHTML = (c.steps || []).map((t) => `<li>${esc(t)}</li>`).join('');
  $('fixbtns2').innerHTML = rest.map((a) => `<button class="btn small" data-fix="${esc(a.id)}">${esc(a.label)}</button>`).join('');
  // a macOS permission (lib/permissions.js): the steps ARE the guide, so they stay open
  $('fixmanual').open = !!c.perm;
  $('fixsum').textContent = c.perm ? 'Steps' : 'I\'d rather do it myself in System Settings';
  $('fixclose').textContent = 'Later';
  $('fixmanual').style.display = (c.steps && c.steps.length) || rest.length ? '' : 'none';
  $('fixstatus').textContent = ''; $('fixstatus').className = 'fixstatus';
  if (!$('fixbox').open) $('fixbox').showModal();
  clearInterval(FIX.timer);
  FIX.timer = setInterval(async () => {   // the user is fixing it right now: check every 2 s
    try {
      const s = await api('/api/setup'); S.checks = s.checks; S.keepOn = s.keepOn;
      // a permission counts as done only when the state says granted (a failed read hides the row)
      const done = c.perm ? S.checks.some((x) => x.id === FIX.open && x.ok) : !findCheck(FIX.open);
      if (done) { $('fixstatus').textContent = c.perm ? `${c.title}: granted. Thank you.` : 'Fixed. Thank you.'; $('fixstatus').className = 'fixstatus ok';
        // like agent-desktop's guide: go on to the next missing permission by itself
        const next = c.perm && allFixable().find((x) => x.perm);
        clearInterval(FIX.timer); setTimeout(() => { closeFix(); render(); if (next) { openFix(next.id); runFix(next.actions[0].id); } }, 1500); }
    } catch { /* keep */ }
  }, 2000);
}
function closeFix() { clearInterval(FIX.timer); if (FIX.open) FIX.dismissed.add(FIX.open); FIX.open = null; if ($('fixbox').open) $('fixbox').close(); }
function autoFix() {   // pop up once per problem; "Later" keeps it closed until the page is reloaded
  if (FIX.open || $('copybox').open) return;
  // the firewall matters only when other computers connect to this one (not for a cloud brain)
  const cloudScreen = !S.done && S.step === 3 && brainPick() === 'cloud';
  // permissions are optional and open only on a click (no window pops up on its own about the screen)
  const c = allFixable().find((x) => !FIX.dismissed.has(x.id) && !x.perm && !(cloudScreen && x.id === 'firewall'));
  if (c) openFix(c.id);
}
async function runFix(id) {
  const st = $('fixstatus'); st.className = 'fixstatus';
  st.textContent = id.includes('allow') || id.includes('awake') ? 'Enter your Mac password in the window macOS shows…' : 'Opening…';
  try { const r = await api('/api/setupFix', { id }); st.textContent = r.message || ''; st.className = 'fixstatus ' + (r.ok ? '' : 'bad'); }
  catch (e) { st.textContent = e.message; st.className = 'fixstatus bad'; }
}

function renderChecks() {
  const bad = S.checks.filter((c) => !c.ok && !c.optional);   // an optional tool (Codex) is never a problem
  const sum = bad.length ? `${I.dotBad}<span><b>${plural(bad.length, 'problem')}</b> on ${esc(S.local)}</span>`

      ${c.ok ? '' : `<div class="cause">${esc(c.cause)}</div>${fixActions(c)}${fixBlock(c.fix)}`}</div></div>`).join('');
  const d = document.querySelector('#checks details');

  } else if (n === 2) {
    // a cloud brain is chosen and always on: from here straight to step 5
    $('next').onclick = () => act(() => api('/api/setupStep', { step: isCloud() ? 5 : 3 }), $('next'));
    wirePairing(); wireCloudCode();
  } else if (n === 3) {
    wireBrainChooser(false);
    const nx = $('next');
    if (nx) nx.onclick = () => (brainPick() === 'cloud' ? act(() => api('/api/setupStep', { step: others().length ? 2 : 5 }), nx)
      : act(() => api('/api/setupBrain', { device: brainPick() }), nx));
  } else if (n === 4) {
    $('ack').onchange = () => { $('next').setAttribute('aria-disabled', String(!$('ack').checked)); if ($('ack').checked) $('err').innerHTML = ''; };
    $('next').onclick = () => {
      if (!$('ack').checked) { $('err').innerHTML = `<div class="note warn" role="alert">${I.warn}<div><p>Tick the box to confirm that the brain stays on.</p></div></div>`; return; }
      act(() => api('/api/setupKeepOn', { ack: true }), $('next'));
    };
  } else if (n === 5) {
    $('next').onclick = async () => {
      const b = $('next'); b.disabled = true;
      try { await api('/api/setupFinish', {}); location.href = '/'; } catch (x) { b.disabled = false; showErr(x.message); }
    };
    wireMoves();
    if (!O) loadOutside();
  }
}
function wirePairing() {
  document.querySelectorAll('.pair').forEach((b) => { b.onclick = async () => {
    const dev = b.dataset.dev; b.disabled = true; delete PAIR_ERR[dev];
    try { PAIRS[dev] = await api('/api/setupPair', { device: dev }); S = await api('/api/setup'); }
    catch (x) { PAIR_ERR[dev] = x.message; }
    render();
  }; });
  document.querySelectorAll('.revoke').forEach((b) => { b.onclick = () => {
    if (confirm(`Disconnect ${b.dataset.dev}? It stops sending sessions until you connect it again.`)) act(() => api('/api/setupRevoke', { device: b.dataset.dev }), b);
  }; });
}
function wireManage() {
  wirePairing(); wireCloudCode(); wireBrainChooser(true);
  const on = (id, fn) => { const e = $(id); if (e) e.onclick = fn; };
  on('add', () => { ADDING = true; render(); const i = document.querySelector('#newdev .name'); if (i) i.focus(); });
  on('addcancel', () => { ADDING = false; render(); });
  on('addsave', () => {
    const r = $('newdev');
    const add = { name: r.querySelector('.name').value, os: (r.querySelector('.seg input:checked') || {}).value || '' };
    const list = others().map((d) => ({ name: d.name, os: d.os })).concat([add]);
    act(async () => { const s = await api('/api/setupDevices', { devices: list }); ADDING = false; return s; }, $('addsave'));
  });
  on('brainchange', () => { CHANGING = true; PICK = null; render(); });
  on('brainno', () => { CHANGING = false; PICK = null; render(); });
  on('brainyes', async () => {
    const dev = (document.querySelector('input[name=brain]:checked') || {}).value;
    const box = $('brainerr');
    if (!$('ack').checked) { box.innerHTML = `<div class="note warn" role="alert">${I.warn}<div><p>Tick the box to confirm that the brain stays on.</p></div></div>`; return; }
    if (isCloud() && !confirm('Stop using your cloud brain? This panel forgets its link. Computers that joined the cloud brain keep sending to it, not to this computer.')) return;
    const b = $('brainyes'); b.disabled = true;
    try { await api('/api/setupBrain', { device: dev }); S = await api('/api/setupKeepOn', { ack: true }); CHANGING = false; PICK = null; render(); }
    catch (x) { b.disabled = false; box.innerHTML = errBox(x.message); }
  });
}
function wireRows() { document.querySelectorAll('.dev .rm').forEach((b) => { b.onclick = () => b.closest('.dev').remove(); }); }
function wireMoves() {
  document.querySelectorAll('.movein').forEach((b) => { b.onclick = async () => {
    const sid = b.dataset.sid; MOVE[sid] = { state: 'moving' }; renderStep5();
    try { await api('/api/setupMoveIn', { sid }); MOVE[sid] = { state: 'done' }; }
    catch (x) { MOVE[sid] = { state: 'error', msg: x.message }; }
    renderStep5();
  }; });
}
async function loadOutside() {
  try {
    const o = await api('/api/setupOutside');
    // a moved session is no longer "outside": keep showing it, marked as moved
    for (const sid of Object.keys(MOVE)) {
      if (MOVE[sid].state !== 'done' || !O || !O.outside || o.outside.some((r) => r.sid === sid)) continue;
      const r = O.outside.find((x) => x.sid === sid); if (r) o.outside.push(r);
    }
    O = o;
  } catch (x) { O = { error: x.message }; }
  renderStep5();
}
function renderStep5() {
  if (!S || S.done || welcome || S.step !== 5 || !$('outlist')) return;
  $('brainlist').innerHTML = brainList(); $('outlist').innerHTML = outList(); wireMoves();
}

function render() {
  renderRail();
  const bad = S.checks.filter((c) => !c.ok && !c.optional);   // an optional tool (Codex) is never a problem
  const probs = bad.length ? `<div class="note bad probs" role="alert">${I.bad}<div><p class="t">${esc(S.local)} has ${plural(bad.length, 'problem')}: ${bad.map((c) => esc(c.title)).join(', ')}</p>
    <p>The panel cannot work fully until ${bad.length === 1 ? 'it is' : 'they are'} fixed. The cause and the fix are under "This computer". <button class="linkbtn" data-showchecks>Show the fix</button></p></div></div>` : '';
  $('view').innerHTML = probs + (S.done ? SCREEN.done() : welcome ? SCREEN.welcome() : SCREEN[S.step]());
  if (S.done) wireManage(); else wire();
  setTimeout(autoFix, 400);
}

document.addEventListener('click', (e) => {
  const c = e.target.closest('[data-copy]'); if (c) return copy(c.dataset.copy, c);
  const fx = e.target.closest('[data-fix]'); if (fx) return runFix(fx.dataset.fix);
  const fc = e.target.closest('[data-fixcheck]'); if (fc) { FIX.dismissed.delete(fc.dataset.fixcheck); return openFix(fc.dataset.fixcheck); }
  if (e.target.closest('#fixclose')) return closeFix();
  if (e.target.closest('#relink')) { closeFix(); const i = $('link'); if (i) { i.focus(); i.select(); } return; }
  const dc = e.target.closest('[data-decide]');
  if (dc) {
    const decision = dc.dataset.decide;
    if (decision === 'revoke' && !confirm(`Disconnect ${dc.dataset.name}? It can no longer send sessions to your cloud brain.`)) return;
    return act(() => api('/api/setupCloudDevice', { id: dc.dataset.id, decision }), dc);
  }
  const d = e.target.closest('[data-diag]'); if (d) return copyDiagnostics(d);
  if (e.target.closest('[data-showchecks]')) { const d = document.querySelector('#checks details'); d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
  const g = e.target.closest('[data-goto]'); if (g) return act(() => api('/api/setupStep', { step: Number(g.dataset.goto) }));
});
$('copyclose').onclick = () => $('copybox').close();

(async function load() {
  try {
    S = await api('/api/setup');
    welcome = !S.done && S.step === 1 && !others().length && !store.get('cc-setup-welcomed') && !/[?&]skipwelcome/.test(location.search);
    render();
  } catch (e) {
    $('checks').innerHTML = '';
    $('view').innerHTML = `<h2>The panel server is not answering</h2>
      <p class="lead">This page needs the Thoth server on this computer.</p>
      ${errBox(e.message, 'No answer from the server')}
      <h3>Start it</h3><p>Open a terminal and run:</p>${cmdBlock('thoth web')}<p class="muted">Then reload this page.</p>
      <div class="nav"><span></span><button class="btn primary" onclick="location.reload()">Reload</button></div>`;
  }
})();

// every 10 s: the checks (the user may be fixing something in a terminal)
setInterval(async () => {
  if (!S) return;
  try { const s = await api('/api/setup'); S.checks = s.checks; S.keepOn = s.keepOn; renderChecks(); } catch { /* keep */ }
}, 10000);
// step 2: watch for devices to connect
setInterval(async () => {
  if (!S || welcome || (!S.done && S.step !== 2) || ADDING || CHANGING) return;
  try {
    const s = await api('/api/setup');
    const ck = (x) => (x.cloud ? ['pending', 'later', 'approved', 'ignored'].map((k) => (x.cloud[k] || []).map((d) => `${d.id}:${d.sessions}`).join(',')).join('|') +
      `${x.cloud.up}:${JSON.stringify(x.cloud.self.push || {})}:${x.cloud.self.pushing}` : '');
    const key = (x) => x.devices.map((d) => `${d.name}:${d.connected}:${d.sessions}:${!!d.pairing}:${d.lastSeen}`).join('|') + ck(x);
    // do not redraw under the user's typing (pre-approved code name, connect link)
    if (document.activeElement && document.activeElement.matches('#view input[type=text]')) return;
    if (key(s) !== key(S)) { S = s; render(); }
  } catch { /* keep */ }
}, 3000);
// step 5: refresh the session lists
setInterval(() => { if (S && !S.done && !welcome && S.step === 5 && !Object.values(MOVE).some((m) => m.state === 'moving')) loadOutside(); }, 6000);
// join code countdown
setInterval(() => {
  let expired = false;
  document.querySelectorAll('[data-exp]').forEach((el) => { const x = Number(el.dataset.exp); el.textContent = left(x); if (x < Date.now()) expired = true; });
  if (expired) render();
}, 1000);
</script>
</body>
